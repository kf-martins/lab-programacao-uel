<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Contatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="card shadow-sm border-0" style="max-width: 430px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">Gerenciamento de contatos</h1>
            <p class="text-secondary mb-4">Entre com seu e-mail e sua senha.</p>

            <div th:if="${erro != null}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <p class="small text-secondary mt-4 mb-0">Projeto didático de sessões HTTP com Spring Boot.</p>
        </div>
    </section>
</main>
</body>
</html>
