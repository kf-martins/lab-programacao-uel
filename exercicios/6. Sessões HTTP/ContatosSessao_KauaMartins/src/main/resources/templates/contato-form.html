<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloFormulario}">Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/contatos}">Contatos</a>
        <a class="btn btn-light btn-sm" th:href="@{/logout}">Sair</a>
    </div>
</nav>
<main class="container py-4">
    <div class="card border-0 shadow-sm mx-auto" style="max-width: 720px;">
        <div class="card-body p-4">
            <h1 class="h3 mb-4" th:text="${tituloFormulario}">Contato</h1>
            <form th:action="${contato.id == null} ? @{/contatos} : @{/contatos/{id}(id=${contato.id})}"
                  th:object="${contato}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome</label>
                        <input id="nome" class="form-control" th:field="*{nome}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input id="telefone" class="form-control" th:field="*{telefone}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">E-mail</label>
                        <input id="email" type="email" class="form-control" th:field="*{email}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="dataNascimento" class="form-label">Data de nascimento</label>
                        <input id="dataNascimento" type="date" class="form-control" th:field="*{dataNascimento}">
                    </div>
                    <div class="col-12">
                        <label for="endereco" class="form-label">Endereço</label>
                        <input id="endereco" class="form-control" th:field="*{endereco}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('endereco')}" th:errors="*{endereco}"></div>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a class="btn btn-outline-secondary" th:href="@{/contatos}">Cancelar</a>
                    <button class="btn btn-primary" type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
