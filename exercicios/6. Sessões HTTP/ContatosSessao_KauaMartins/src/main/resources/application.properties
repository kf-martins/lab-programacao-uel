spring.application.name=contatos-sessao
server.port=8080

# Ajuste as credenciais por variáveis de ambiente ou altere os valores abaixo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/contatos_sessao?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema é criado pelo arquivo dados.sql. Hibernate apenas confere o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
