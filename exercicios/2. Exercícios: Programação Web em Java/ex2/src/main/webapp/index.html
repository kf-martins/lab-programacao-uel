
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média do Aluno</title>
    <style>
        :root {
            color-scheme: light;
            --verde-escuro: #14532d;
            --verde: #16a34a;
            --verde-claro: #dcfce7;
            --texto: #173322;
            --borda: #bbf7d0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--texto);
            background: linear-gradient(135deg, #f0fdf4, #bbf7d0);
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 460px);
            background: rgba(255, 255, 255, .96);
            border: 1px solid var(--borda);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 18px 45px rgba(20, 83, 45, .18);
        }

        h1 {
            color: var(--verde-escuro);
            margin: 0 0 8px;
            text-align: center;
        }

        .subtitulo {
            color: #527060;
            margin: 0 0 28px;
            text-align: center;
        }

        .campo {
            display: block;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        button {
            width: 100%;
            font: inherit;
            border-radius: 10px;
            padding: 12px 14px;
        }

        input,
        select {
            color: var(--texto);
            background: #fff;
            border: 1px solid #86efac;
        }

        input:focus,
        select:focus {
            outline: 3px solid var(--verde-claro);
            border-color: var(--verde);
        }

        button {
            border: 0;
            color: white;
            background: var(--verde);
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            transition: background .2s ease, transform .2s ease;
        }

        button:hover {
            background: #15803d;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <main>
        <h1>Calculadora de Média</h1>
        <p class="subtitulo">Informe as notas para descobrir o resultado do aluno.</p>

        <form action="calculadora-media" method="post">
            <div class="campo">
                <label for="nota1">Nota 1</label>
                <input type="number" id="nota1" name="nota1"
                       step="any" min="0" max="10" required>
            </div>

            <div class="campo">
                <label for="nota2">Nota 2</label>
                <input type="number" id="nota2" name="nota2"
                       step="any" min="0" max="10" required>
            </div>

            <div class="campo">
                <label for="nota3">Nota 3</label>
                <input type="number" id="nota3" name="nota3"
                       step="any" min="0" max="10" required>
            </div>

            <div class="campo">
                <label for="tipoMedia">Tipo de média</label>
                <select id="tipoMedia" name="tipoMedia" required>
                    <option value="aritmetica">Aritmética</option>
                    <option value="ponderada">Ponderada (pesos 2, 3 e 5)</option>
                </select>
            </div>

            <button type="submit">Calcular média</button>
        </form>
    </main>
</body>
</html>
