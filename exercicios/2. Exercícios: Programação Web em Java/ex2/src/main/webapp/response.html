
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{titulo}}</title>

    <style>
        :root {
            color-scheme: light;
            --verde-escuro: #14532d;
            --verde: #16a34a;
            --verde-claro: #dcfce7;
            --texto: #173322;
            --borda: #bbf7d0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--texto);
            background: linear-gradient(135deg, #f0fdf4, #bbf7d0);
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 460px);
            background: rgba(255, 255, 255, .96);
            border: 1px solid var(--borda);
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(20, 83, 45, .18);
            text-align: center;
        }

        h1 {
            color: var(--verde-escuro);
            margin: 0 0 20px;
        }

        .sucesso,
        .erro {
            line-height: 1.5;
        }

        .sucesso {
            color: #166534;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .erro {
            color: #b91c1c;
        }

        .situacao {
            font-weight: bold;
        }

        .reprovado {
            color: #b91c1c;
        }

        .aprovado {
            color: #2563eb;
        }

        .exame {
            color: #b45309;
        }

        a {
            display: inline-block;
            margin-top: 22px;
            padding: 11px 18px;
            border-radius: 10px;
            color: var(--verde-escuro);
            background: var(--verde-claro);
            font-weight: bold;
            text-decoration: none;
            transition: background .2s ease;
        }

        a:hover {
            background: #bbf7d0;
        }
    </style>
</head>
<body>
    <main>
        <h1>{{titulo}}</h1>
        <p class="{{classe}}">{{mensagem}} <span class="situacao {{classeSituacao}}">{{situacao}}</span></p>
        <a href="./">Voltar à calculadora</a>
    </main>
</body>
</html>
