<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Java</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f3f4f6;
            color: #1f2937;
            font-family: Arial, Helvetica, sans-serif;
        }
        main {
            width: min(100%, 430px);
            padding: 28px;
            border-radius: 14px;
            background: white;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .08);
        }
        h1 { margin-top: 0; margin-bottom: 8px; }
        p { color: #4b5563; margin-top: 0; }
        label { display: block; margin: 18px 0 7px; font-weight: 600; }
        input, select, button {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus, select:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
        button {
            margin-top: 22px;
            border: 0;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<main>
    <h1>Calculadora</h1>
    <p>Informe dois números e escolha a operação.</p>

    <form action="calcular" method="post">
        <label for="operando1">Primeiro operando</label>
        <input type="number" id="operando1" name="operando1" step="any" required>

        <label for="operando2">Segundo operando</label>
        <input type="number" id="operando2" name="operando2" step="any" required>

        <label for="operacao">Operação</label>
        <select id="operacao" name="operacao" required>
            <option value="somar">Adição (+)</option>
            <option value="subtrair">Subtração (-)</option>
            <option value="multiplicar">Multiplicação (×)</option>
            <option value="dividir">Divisão (÷)</option>
        </select>

        <button type="submit">Calcular</button>
    </form>
</main>
</body>
</html>
