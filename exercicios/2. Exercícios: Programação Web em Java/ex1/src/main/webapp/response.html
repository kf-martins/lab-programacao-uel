
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{titulo}}</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            width: min(100%, 430px);
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .08);
        }

        .sucesso {
            color: #166534;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .erro {
            color: #b91c1c;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            color: #2563eb;
        }
    </style>
</head>
<body>
    <main>
        <h1>{{titulo}}</h1>
        <p class="{{classe}}">{{mensagem}}</p>
        <a href="./">Voltar à calculadora</a>
    </main>
</body>
</html>
