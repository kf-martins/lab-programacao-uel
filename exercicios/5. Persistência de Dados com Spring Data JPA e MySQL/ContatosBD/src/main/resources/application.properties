spring.application.name=contatos-bd
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gerenciamento_contatos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:contatos_app}
spring.datasource.password=${DB_PASSWORD:contatos_app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
